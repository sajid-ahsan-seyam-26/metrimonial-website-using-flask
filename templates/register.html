{% extends 'base.html' %}

{% block content %}
<h2>Create Your Matrimonial Profile</h2>

<form id="regForm" action="{{ url_for('register') }}" method="POST">
    <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="e.g., asif26">
    </div>

    <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="e.g., Asif Rahman">
    </div>

    <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender" name="gender">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>
    </div>

    <div class="form-group">
        <label for="age">Age</label>
        <input type="number" id="age" name="age" min="18" max="70" placeholder="Must be 18 or older">
    </div>

    <div class="form-group">
        <label for="profession">Profession</label>
        <input type="text" id="profession" name="profession" placeholder="e.g., Engineer, Doctor, Student">
    </div>

    <div class="form-group">
        <label for="bio">About Yourself</label>
        <textarea id="bio" name="bio" rows="4" placeholder="Describe your hobbies, values, and what you are looking for..."></textarea>
    </div>

    <button type="submit">Register Profile</button>
</form>

<script>
    document.getElementById('regForm').addEventListener('submit', function(event) {
        let username = document.getElementById('username').value.trim();
        let name = document.getElementById('name').value.trim();
        let gender = document.getElementById('gender').value;
        let age = document.getElementById('age').value;

        if (!username || !name || !gender || !age) {
            alert('Please fill out all the mandatory basic fields!');
            event.preventDefault(); // Stops form from submitting
        }
    });
</script>
{% endblock %}
